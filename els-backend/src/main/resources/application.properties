spring.application.name=els-backend
server.port=8081

# MySQL from XAMPP (default user is root with an empty password)
spring.datasource.url=jdbc:mysql://localhost:3306/els_db
spring.datasource.username=root
spring.datasource.password=

# Tables already exist from els_schema.sql, so Hibernate must not change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT login tokens (use a long random text of 32+ characters)
app.jwt.secret=change-this-to-a-long-random-secret-at-least-32-chars
app.jwt.expiration-ms=86400000

# Address of the Next.js frontend
app.cors.origin=http://localhost:3000
